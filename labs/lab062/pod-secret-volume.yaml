# Consume the Secret as FILES (volume mount).
# Each key becomes a file under /etc/secrets, backed by tmpfs (RAM), never
# written to the node disk. Preferred over env for credentials.
# Requires the db-cred Secret to exist first (created in Section B).
apiVersion: v1
kind: Pod
metadata:
  name: secret-vol
  namespace: config-demo
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh","-c","sleep 3600"]
    volumeMounts:
    - name: sec
      mountPath: /etc/secrets
      readOnly: true
  volumes:
  - name: sec
    secret:
      secretName: db-cred
