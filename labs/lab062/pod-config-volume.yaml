apiVersion: v1
kind: Pod
metadata:
  name: config-vol
  namespace: config-demo
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh","-c","sleep 3600"]
    volumeMounts:
    - name: cfg
      mountPath: /etc/appconfig
      readOnly: true
  volumes:
  - name: cfg
    configMap:
      name: app-config
