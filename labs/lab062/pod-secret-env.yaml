# Consume the Secret as ENVIRONMENT VARIABLES.
# Convenient, but env vars are leakier (logs, crash dumps, /proc/<pid>/environ,
# child processes) and are frozen at pod start. Prefer the file mount below.
# Requires the db-cred Secret to exist first (created in Section B).
apiVersion: v1
kind: Pod
metadata:
  name: secret-env
  namespace: config-demo
spec:
  containers:
  - name: app
    image: busybox
    command: ["sh","-c","sleep 3600"]
    env:
    - name: DB_USER
      valueFrom:
        secretKeyRef:
          name: db-cred
          key: DB_USER
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-cred
          key: DB_PASSWORD
